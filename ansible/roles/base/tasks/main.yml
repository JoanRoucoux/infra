---
- name: Install the packages the other roles rely on
  ansible.builtin.apt:
    name:
      - ca-certificates
      - cron
      - curl
      - python3-requests
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set the timezone
  community.general.timezone:
    name: "{{ timezone }}"
  notify: Restart cron

- name: Allocate the swap file
  community.general.filesize:
    path: /swapfile
    size: "{{ swap_size }}"
    owner: root
    group: root
    mode: "0600"
  register: base_swapfile

- name: Format the swap file
  ansible.builtin.command: mkswap /swapfile
  when: base_swapfile is changed
  changed_when: true

- name: Enable the swap file now
  ansible.builtin.command: swapon /swapfile
  when: base_swapfile is changed
  changed_when: true

- name: Enable the swap file at boot
  ansible.posix.mount:
    src: /swapfile
    path: none
    fstype: swap
    opts: sw
    state: present

- name: Prefer RAM over swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_file: /etc/sysctl.d/60-swappiness.conf
    state: present

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cap the journal size
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-size.conf
    content: |
      [Journal]
      SystemMaxUse=500M
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
